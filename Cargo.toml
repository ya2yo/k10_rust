[workspace]
resolver = "2"
members = [
    "apps/*",
]
exclude = [
    "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["ya2yo"]
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", default-features = false, features = ["std", "binstart"] }
embuild = { version = "0.32", features = ["espidf"] }
anyhow = "1.0"
rmodbus = "0.7"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
